  for(let x=0;x<w;x+=64){

  }
  // Chevrones de peligro en la base
  const chH=52,chY=h-chH;
  g.save();g.beginPath();g.rect(0,chY,w,chH);g.clip();
  g.fillStyle='#0c0c12';g.fillRect(0,chY,w,chH);
  for(let x=-90;x<w+90;x+=64){
    g.save();g.beginPath();
    g.moveTo(x,chY);g.lineTo(x+32,chY);
    g.lineTo(x+32+chH,chY+chH);g.lineTo(x+chH,chY+chH);

  g.shadowColor='#22e5ff';g.shadowBlur=16;

/* --- Geometría del muro continuo --- */
function makeWallGeo(side){
  const pos=[],uv=[],nor=[],idx=[];
  const W=side*WALL;
  for(let i=0;i<=N;i++){
    const k=i%N,p=P[k],r=RT[k];
    const bx=p.x+r.x*W,bz=p.z+r.z*W;
    pos.push(bx,0,bz, bx,WALL_H,bz);
    uv.push(i*0.15,0, i*0.15,1);
    const nx=-side*r.x,nz=-side*r.z;
    nor.push(nx,0,nz, nx,0,nz);
    if(i<N){const a=i*2;idx.push(a,a+1,a+2, a+1,a+3,a+2);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setIndex(idx);
  return g;
}
[-1,1].forEach(side=>{
  const mesh=new THREE.Mesh(makeWallGeo(side),wallMat);
  mesh.receiveShadow=true;
  scene.add(mesh);
});

/* --- Tubo de neón en la parte superior (color por zona) --- */
function makeRailCurve(side){
  const pts=[];const W=side*WALL;
  for(let i=0;i<=N;i++){
    const k=i%N,p=P[k],r=RT[k];
    pts.push(new THREE.Vector3(p.x+r.x*W, WALL_H+0.08, p.z+r.z*W));
  }
  return new THREE.CatmullRomCurve3(pts,true);
}
[-1,1].forEach(side=>{
  const curve=makeRailCurve(side);
  const radial=5;
  const geo=new THREE.TubeGeometry(curve,N,0.12,radial,true);
  const cnt=geo.attributes.position.count;
  const colors=new Float32Array(cnt*3);
  const c=new THREE.Color();
  for(let v=0;v<cnt;v++){
    const segIdx=Math.floor(v/(radial+1));
    const zone=Math.min(Math.floor(segIdx*6/N),5);
    c.setHex(ZC[zone]);
    colors[v*3]=c.r;colors[v*3+1]=c.g;colors[v*3+2]=c.b;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3));

m.visible=!c.elim&&(c.inv<=0||Math.floor(tt*14)%2===0);m.position.set(c.pos.x,Math.sin(tt*50+c.idx)*.012*Math.min(1,Math.abs(c.speed)/40),c.pos.z);m.rotation.set(c.pitch,c.h,c.rl);
m.userData.ws.forEach(w=>w.rotation.x+=c.speed*dt/.55);m.userData.fr.forEach(f=>f.rotation.y=c.steer*.45);m.userData.sh.visible=c.shield>0;
if(m.userData.driver){const spd=Math.abs(c.speed);m.userData.driver.position.y=.84+Math.sin(tt*22)*(spd>5?.012:0)}
if(m.userData.steeringWheel)m.userData.steeringWheel.rotation.z=-c.steer*.5}
const p0=hum[0];moon.position.set(p0.pos.x+60,120,p0.pos.z+40);moon.target.position.copy(p0.pos);
for(let i=0;i<RN;i++){const k=i*3;rO[k+1]-=55*dt;if(rO[k+1]<0)rO[k+1]+=50;rP[k]=p0.pos.x+rO[k];rP[k+1]=rO[k+1];rP[k+2]=p0.pos.z+rO[k+2]}rGeo.attributes.position.needsUpdate=true;
for(let i=0;i<AMB_N;i++){
  const k=i*3,ph=ambPhase[i];
  ambPos[k]+=Math.sin(tt*.4+ph)*dt*1.2;
  ambPos[k+1]+=Math.cos(tt*.3+ph*1.3)*dt*.5;
  ambPos[k+2]+=Math.sin(tt*.35+ph*1.7)*dt*1.2;
  const dx=ambPos[k]-p0.pos.x,dz=ambPos[k+2]-p0.pos.z;
  if(dx>90)ambPos[k]-=180;if(dx<-90)ambPos[k]+=180;
  if(dz>90)ambPos[k+2]-=180;if(dz<-90)ambPos[k+2]+=180;
  if(ambPos[k+1]>36)ambPos[k+1]=1;if(ambPos[k+1]<1)ambPos[k+1]=36;
}
ambGeo.attributes.position.needsUpdate=true;
searchlights.forEach(({group,phase})=>{
  group.rotation.z=Math.sin(tt*.35+phase)*.5;
  group.rotation.x=Math.cos(tt*.28+phase*1.3)*.3;
});
mists.forEach(m=>{m.spr.material.opacity=m.baseOp*(.7+Math.sin(tt*.5+m.phase)*.3)});
for(let i=0;i<mode;i++){updCam(i,dt);const c=hum[i];$('pos'+i).textContent=c.rk+'º';$('lap'+i).textContent='VUELTA '+clamp(c.lap,1,LAPS)+'/'+LAPS;$('hp'+i).textContent='♥'.repeat(c.hp)+'♡'.repeat(3-c.hp);
$('it'+i).textContent=c.roll>0?c.rollI:c.item?IT[c.item]:'—';$('spd'+i).textContent=Math.round(Math.abs(c.speed)*3.6)+' KM/H';$('el'+i).style.display=c.elim?'block':'none'}snap=false;
const speed=Math.abs(hum[0]?.speed||0);
document.body.classList.toggle('speeding',started&&speed>30);
document.body.classList.toggle('boosting',!!hum[0]&&(hum[0].boost>0||speed>55));
const tl=Math.max(0,timeLeft);$('tm').textContent=Math.floor(tl/60)+':'+String(Math.floor(tl%60)).padStart(2,'0');$('time').className=tl<15&&started?'low':'';drawMM();
if(started){if(mode===1){if(p0.fin)endRace(p0.finR===1?'win':p0.finR>=5?'lose':'fin','META EN EL PUESTO '+p0.finR+'º');else if(p0.elim)endRace('lose','TE QUEDASTE SIN VIDA');else if(timeLeft<=0)endRace('lose','SE AGOTÓ EL TIEMPO')}
else if(hum.every(h=>h.fin||h.elim)||timeLeft<=0)endRace('two','')}}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;
if(state==='RACE')update(dt);else if(state==='RES'){updP(dt);updFlashes(dt)}if(state==='RACE'||state==='PAUSE'||state==='RES')render();
if(AC){const on=state==='RACE'&&hum[0];engG.gain.setTargetAtTime(on?.04+.03*Math.min(1,hum[0].speed/60):0,AC.currentTime,.1);if(on)eng.frequency.setTargetAtTime(45+Math.abs(hum[0].speed)*2.4,AC.currentTime,.1)}}
resize();go('MENU');requestAnimationFrame(loop);
</script></body></html>
