<!--
=== README ===
 YK RACER - carreras 3D nocturnas en Tokio con estética arcade años 2000.
CONTROLES  J1: Flechas mover | ESPACIO derrapar | SHIFT/INTRO/E usar ítem | C cámara
           J2: W A S D mover | Q derrapar | R/F usar ítem | V cámara      ESC: pausa
OBJETIVO   3 vueltas. 1J: gana quien cruce 1º; derrota si llegas 5º o peor, pierdes las 3 vidas o se acaba el tiempo (3:00).
           2J: pantalla dividida, gana el mejor clasificado. 3 impactos = eliminado.
ÍTEMS      Bomba, Turbo, Escudo, Aceite (trampa), Hueso teledirigido.
Superficies: asfalto normal, arcén de césped lento, muros con rebote. Derrape >1s = mini-turbo.
